<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LISWORD 아이콘 원본</title>
  <!--
    apple-touch-icon.png (180×180) 과 logo-512.png (512×512) 의 원본입니다.
    favicon.svg 와 같은 도형을 화면 크기에 꽉 차게 그립니다.
    다시 만들 때: tools/brand/render.sh 실행
  -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FF6B1A; }
    /* 크롬 headless 는 창 너비를 약 500px 아래로 줄이지 않으므로, 가로·세로 중 짧은 쪽(vmin)에 맞춰 정사각형을 그립니다. */
    svg { display: block; width: 100vmin; height: 100vmin; }
  </style>
</head>
<body>
  <svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
    <rect width="28" height="28" fill="#FF6B1A"/>
    <path d="M6 6 H22 V15.6 H15.6 V22 H6 Z" fill="#FAF8F5"/>
  </svg>
</body>
</html>
