<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LISWORD 공유 카드 원본 (1200×630)</title>
  <!--
    og-image.png (카카오톡·페이스북·검색 공유 미리보기 이미지) 의 원본입니다.
    문구를 바꾼 뒤 tools/brand/render.sh 를 실행하면 저장소 루트의 og-image.png 가 다시 만들어집니다.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF8F5;
      --fg: #15110E;
      --fg-2: #5B544D;
      --line-soft: rgba(21, 17, 14, 0.12);
      --accent: #FF6B1A;
      --font-kr: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-en: "Space Grotesk", "Pretendard", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-kr);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    .card {
      width: 1200px;
      height: 630px;
      padding: 64px 80px 60px;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .logo svg { width: 44px; height: 44px; display: block; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-en);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--fg-2);
    }
    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--accent);
    }
    h1 {
      margin: auto 0 0;
      font-size: 100px;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }
    h1 .line { display: block; }
    h1 .accent { color: var(--accent); }
    .sub {
      margin: 30px 0 0;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--fg-2);
      letter-spacing: -0.015em;
    }
    .foot {
      margin-top: 44px;
      padding-top: 22px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-en);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="logo">
        <svg viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="28" height="28" fill="#FF6B1A"/>
          <path d="M6 6 H22 V15.6 H15.6 V22 H6 Z" fill="#FAF8F5"/>
        </svg>
        <span>LISWORD</span>
      </div>
      <div class="eyebrow">AI Education · Est. Sungkyunkwan</div>
    </div>

    <h1>
      <span class="line">대학·기업을 위한</span>
      <span class="line">현장형 <span class="accent">AI 교육</span>.</span>
    </h1>
    <p class="sub">바이브코딩 부트캠프 · AI 리터러시 · RAG · AX 전환</p>

    <div class="foot">
      <span>www.lisword.co.kr</span>
    </div>
  </div>
</body>
</html>
