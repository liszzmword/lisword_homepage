<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LISWORD 주간 AI 소식 타임라인 원본 (1600×900)</title>
  <!--
    주간 AI 소식 본문 그림(timeline.png) 원본입니다.
    주소 뒤 ?d= 에 JSON을 URL 인코딩해서 넘깁니다.
      {"label":"11월 1주차","range":"11월 2일~11월 8일",
       "rows":[["11.2","앤트로픽 수정 신고서, 3분기 매출 공개",3], ...],
       "after":[["11.12","젠슨 황 사임"], ...]}
    rows의 세 번째 값은 본문 항목 번호입니다 (여러 개면 [1,4]).
  -->
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />
  <style>
    :root { --bg:#FAF8F5; --fg:#15110E; --fg-2:#6B635B; --line:rgba(21,17,14,.13); --accent:#FF6B1A; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1600px; height: 900px; overflow: hidden; background: var(--bg); color: var(--fg);
           font-family: "Pretendard", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.015em; }
    .wrap { padding: 64px 72px 0; height: 900px; display: flex; flex-direction: column; }
    .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: var(--fg-2); }
    .eyebrow::before { content: ""; width: 12px; height: 12px; border-radius: 99px; background: var(--accent); }
    h1 { margin: 14px 0 0; font-size: 54px; font-weight: 800; letter-spacing: -0.04em; }
    h1 em { font-style: normal; color: var(--accent); }
    .cols { display: flex; gap: 48px; margin-top: 40px; flex: 1; }
    .main { flex: 1; border-top: 3px solid var(--fg); }
    .side { width: 470px; border-top: 3px solid var(--accent); }
    .head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 14px; font-size: 28px; font-weight: 800; }
    .head span { font-size: 24px; font-weight: 500; color: var(--fg-2); }
    .row { display: flex; align-items: center; gap: 28px; min-height: 96px; border-top: 1px solid var(--line); padding: 12px 0; }
    .date { width: 120px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.03em; }
    .text { flex: 1; font-size: 31px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
    .nums { display: flex; gap: 8px; }
    .num { width: 50px; height: 50px; border: 2px solid var(--fg); display: flex; align-items: center; justify-content: center;
           font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 28px; }
    .card { display: flex; align-items: center; gap: 22px; background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--accent);
            padding: 20px 22px; margin-top: 14px; }
    .card .date { width: 104px; color: var(--accent); font-size: 34px; }
    .card .text { font-size: 27px; font-weight: 700; }
    .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line);
            margin: 0 0 40px; padding-top: 22px; font-size: 24px; color: var(--fg-2); }
    .brand { display: flex; align-items: center; gap: 10px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 28px; color: var(--fg); letter-spacing: .04em; }
    .brand i { width: 16px; height: 16px; background: var(--accent); display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="cols">
      <div class="main"><div class="head">이번 주 있었던 일<span id="year">2026년</span></div><div id="rows"></div></div>
      <div class="side" id="side"><div class="head">그 뒤 이야기<span>11월 20일 기준</span></div><div id="after"></div></div>
    </div>
    <div class="foot"><span>네모 안 숫자 = 본문 항목 번호 · 회사·기관 발표와 보도 기준(현지 날짜)</span><span class="brand"><i></i>LISWORD</span></div>
  </div>
  <script>
    const d = JSON.parse(new URLSearchParams(location.search).get("d"));
    const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    document.getElementById("eyebrow").textContent = `AI 소식 · ${d.label}`;
    document.getElementById("title").innerHTML = `한눈에 보는 이번 주, <em>${esc(d.range)}</em>`;
    document.getElementById("rows").innerHTML = d.rows.map(r =>
      `<div class="row"><div class="date">${esc(r[0])}</div><div class="text">${esc(r[1])}</div><div class="nums">${[].concat(r[2]).map(n => `<div class="num">${esc(n)}</div>`).join("")}</div></div>`).join("");
    if (d.after && d.after.length) {
      document.getElementById("after").innerHTML = d.after.map(r =>
        `<div class="card"><div class="date">${esc(r[0])}</div><div class="text">${esc(r[1])}</div></div>`).join("");
    } else { document.getElementById("side").remove(); }
  </script>
</body>
</html>
