{# 블로그 모든 페이지의 바깥 틀 (머리·메뉴·바닥). {{이름}} 자리는 tools/build_blog.py가 채웁니다.
   Google 태그(gtag) 부분은 홈페이지 index.html과 똑같이 유지하세요. #}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonical}}" />
  <meta name="robots" content="{{robots}}" />
  <meta name="theme-color" content="#FAF8F5" />

  <!-- 공유 미리보기 (카카오톡·페이스북·링크드인·X) -->
{{social_meta}}

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XFCE89BGF7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XFCE89BGF7');
  </script>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="alternate" type="application/rss+xml" title="리즈워드 블로그" href="https://www.lisword.co.kr/blog/feed.xml" />

  <!-- 검색엔진용 구조화 데이터 -->
  <script type="application/ld+json">
{{json_ld}}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/blog/blog.css" />
</head>
<body class="blog{{body_class}}">
{{draft_banner}}  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="logo"><span class="logo-mark"></span><span>LISWORD</span></a>
      <nav class="nav-links" aria-label="주요 메뉴">
        <a href="/university/">대학·사업단</a>
        <a href="/#programs">교육</a>
        <a href="/#cases">사례</a>
        <a href="/blog/" class="is-active"{{blog_current}}>블로그</a>
        <a href="/#contact">문의</a>
      </nav>
      <a href="/#contact" class="nav-cta" onclick="if (window.gtag) gtag('event', 'cta_contact_click', { location: 'blog_nav' });">상담 신청</a>
    </div>
  </header>

  <main id="main">
{{main}}
  </main>

  <footer class="wrap footer">
    <div class="footer-inner">
      <div class="logo"><span class="logo-mark"></span><span>LISWORD · 리즈워드</span></div>
      <nav class="footer-links" aria-label="바로가기">
        <a href="/university/">대학·사업단 프로그램</a>
        <a href="/blog/">블로그</a>
        <a href="/news.html">언론 보도</a>
      </nav>
      <div class="footer-meta" id="copy-year">© LISWORD. ALL RIGHTS RESERVED · LISWORD.CO.KR</div>
    </div>
  </footer>
  <script>
    (function () {
      var copy = document.getElementById('copy-year');
      if (copy) copy.textContent = '© ' + new Date().getFullYear() + ' LISWORD. ALL RIGHTS RESERVED · LISWORD.CO.KR';
    })();
  </script>
</body>
</html>
