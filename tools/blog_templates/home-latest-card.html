{# 홈페이지 요약 블록의 글 카드 한 장 #}
          <a href="{{url}}" class="blog-latest-card">
            <div class="blog-latest-cover"><img src="{{cover}}" alt="" width="{{width}}" height="{{height}}" loading="lazy" decoding="async" /></div>
            <div class="blog-latest-body">
              <div class="news-card-top"><span class="news-card-source">{{category}}</span> <span class="news-card-date">{{date}}</span></div>
              <h3 class="news-card-title">{{title}}</h3>
            </div>
          </a>
